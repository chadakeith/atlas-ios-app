# Fallback project definition for XcodeGen (https://github.com/yonaskolb/XcodeGen).
# The checked-in AtlasDashboard.xcodeproj is the source of truth; regenerate with:
#   brew install xcodegen && xcodegen
name: AtlasDashboard
options:
  bundleIdPrefix: com.atlascarolina
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  AtlasDashboard:
    type: application
    platform: iOS
    sources: [AtlasDashboard]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.atlascarolina.AtlasDashboard
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        TARGETED_DEVICE_FAMILY: "1,2"
  AtlasDashboardTests:
    type: bundle.unit-test
    platform: iOS
    sources: [AtlasDashboardTests]
    dependencies:
      - target: AtlasDashboard
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.atlascarolina.AtlasDashboardTests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  AtlasDashboard:
    build:
      targets:
        AtlasDashboard: all
    run:
      config: Debug
    test:
      config: Debug
      targets: [AtlasDashboardTests]
    archive:
      config: Release
